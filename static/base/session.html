<div contenteditable="false" class="main">
	<div class="view">
		<div class="padding">
			<div class="content">
				<p class="title">New Session Created!</p>
				<div style="height:1.5em;"></div>
				<p class="detail">Link for Players:</p>
				<a class="detail" id="player">link</a>
				<div style="height:1.0em;"></div>
				<p class="detail">Link to Scoreboard:</p>
				<a class="detail" id="score">link</a>
				<div style="height:1.5em;"></div>
				<p class="detail">Session will be deleted after 20 Minutes of inactivity!</p>
				<p class="detail">Sessions can be rejoined by using the same name.</p>
			</div>
		</div>
	</div>
</div>

<script>
	window.onload = function () {
		const player = document.getElementById('player');
		const score = document.getElementById('score');
		const base = `${location.protocol}//${location.host}${location.pathname}`;

		player.href = new URL(`./client${location.search}`, base).href;
		score.href = new URL(`./score${location.search}`, base).href;

		player.innerText = player.href;
		score.innerText = score.href;
	};
</script>
